[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smo"
version = "0.1.0"
description = "Autonomous, lightweight, open-source social media orchestrator."
readme = "README.md"  # not yet created, placeholder
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SMO Contributors"}
]
keywords = ["social-media", "automation", "ai-agent", "langchain", "orchestrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities"
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # HTTP / Networking
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # Security
    "cryptography>=42",

    # Config / CLI
    "typer>=0.12",
    "pyyaml>=6.0",

    # Database
    "sqlalchemy>=2.0",

    # Scheduler
    "apscheduler>=3.10",

    # AI (for MVP minimal, phase 2+ will add more)
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",

    # MCP (phase 2)
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx-mock>=0.3",
    "black>=24.0",
    "ruff>=0.8",
]

image-generation = [
    "diffusers>=0.26",
    "transformers>=4.44",
]

llm-cloud = [
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]

[project.scripts]
smo = "smo.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=smo --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
